[package]
name = "grading_app"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
thiserror = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

dioxus = { version = "0.7", features = ["desktop"] }
dioxus-desktop = "0.7"

# gtk3 backend on Linux: native dialogs without depending on zenity
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
csv = "1"
encoding_rs = "0.8"
dirs = "6"
